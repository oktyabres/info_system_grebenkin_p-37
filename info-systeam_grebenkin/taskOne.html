    <h1 class="page-title">1. Задача "Угадай число"</h1>


    <div class="container-OneTaskHtml">
            <form action="" class="OneTaskText">

        <input class="txt-one" type="number" name="textarea" id="myNumber" placeholder="Введите свое число"></input>
        <button class="btn-one" type="button" onclick="checNumber()">GO</button>
        <p id="resultat">Результат:</p>
    </form>

    </div>
  
    <script>

    var randomchislo = Math.floor(Math.random() * 100) + 1; 

    function checNumber() { 
    
        var userNumber = document.getElementById("myNumber").value;
        var resultat = document.getElementById("result");

       
        if (userNumber < 1 || userNumber > 100) { 
            alert("введите число от 1 до 100");


        }

        
        if (userNumber > randomchislo) {
            
            resultat.value = "результат: Меньше";
        } 
        else if (userNumber < randomchislo) {
            resultat.value = "результат: большее";
        } 
        else {
            resultat.value = "результат: верно";
        }
    }


</script>
